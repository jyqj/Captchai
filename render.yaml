services:
  - type: web
    name: captchai
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    # Readiness probe (200 ready / 503 not ready) served by src/api/routes.py;
    # the detailed status endpoint stays at /api/v1/health.
    healthCheckPath: /ready
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CLIENT_KEY
        sync: false
      # Preferred CLOUD_*/LOCAL_* names (legacy CAPTCHA_* aliases still work).
      - key: CLOUD_BASE_URL
        value: "https://your-openai-compatible-endpoint/v1"
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_MODEL
        value: "gpt-5.4"
      - key: LOCAL_MODEL
        value: "qwen3.5-2b"
      - key: CAPTCHA_RETRIES
        value: "3"
      - key: CAPTCHA_TIMEOUT
        value: "30"
      - key: BROWSER_HEADLESS
        value: "true"
      - key: BROWSER_TIMEOUT
        value: "30"
      # Optional: point the proxy/session/ledger backends at a shared Redis
      # instance (e.g. redis://red-xxxxxxxx:6379) for multi-instance deploys
      # and persistence across restarts. Omit to use the in-process defaults.
      # - key: REDIS_URL
      #   sync: false

