name: One-shot normalize Redis response types

on:
  push:
    branches:
      - refactor/indexed-proxy-scheduler

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/indexed-proxy-scheduler
          fetch-depth: 0

      - name: Normalize redis-py response boundaries
        run: python scripts/normalize_indexed_proxy_types.py

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/indexed_proxy_pool.py
          git diff --cached --check
          git commit -m "fix(types): normalize redis response boundaries"
          git push origin HEAD:refactor/indexed-proxy-scheduler
