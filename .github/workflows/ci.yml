name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (ubuntu-latest, redis)
    runs-on: ubuntu-latest
    # The Redis-backed suites (tests/test_consumption.py,
    # tests/test_proxy_pool_redis.py, the Redis task-store case in
    # tests/test_task_manager.py) skip when no server is reachable, so without
    # this service 31 tests silently drop out of CI. They connect to
    # localhost:6379 directly; REDIS_URL documents the same endpoint for any
    # config-driven path.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt (runtime deps,
          # including the pinned Playwright package) plus the redis client.
          # The browser-automation tests use fakes (FakeBrowser / FakeContext);
          # nothing calls chromium.launch(), so no `playwright install` /
          # browser download is needed here.
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  test-windows:
    name: pytest (windows-latest, no redis)
    runs-on: windows-latest
    # No Redis service container here: GitHub Actions service containers are
    # Linux-only. requirements.txt (installed below) does not include the
    # redis client either, so the 31 Redis-backed tests skip cleanly via
    # pytest.importorskip instead of failing against an unreachable
    # localhost:6379. Redis coverage lives in the ubuntu `test` job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The browser-automation tests use fakes (FakeBrowser / FakeContext);
          # nothing calls chromium.launch(), so only the Playwright *package*
          # is needed here — no `playwright install` / browser download.
          # Keep this pin in sync with requirements.txt.
          pip install playwright==1.61.0

      - name: Run tests
        run: python -m pytest tests/ -q

  pyright:
    name: pyright
    runs-on: ubuntu-latest
    # Blocking: the type baseline is at zero errors — keep it that way.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pyright
        run: pyright

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.render -t captchai:ci .
