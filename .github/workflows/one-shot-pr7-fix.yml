name: One-shot PR7 boundary fix

on:
  push:
    branches:
      - refactor/atomic-proxy-transactions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/atomic-proxy-transactions
          fetch-depth: 0

      - name: Patch cooldown rehabilitation and typed snapshot boundary
        run: |
          echo '' | base64 --decode > /tmp/patch-pr7.py
          python /tmp/patch-pr7.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/atomic_proxy_pool.py tests/test_atomic_proxy_pool.py
          git diff --cached --check
          git commit -m "fix(proxy): rehabilitate cooldown assets and tighten typing"
          git push origin HEAD:refactor/atomic-proxy-transactions
